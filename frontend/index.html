<!doctype html>
<html lang="zh-CN" class="app-starting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#edf4f1" />
    <style>
      .android-startup-shell { display: none; }
      html.platform-android.app-starting .android-startup-shell {
        position: fixed; inset: 0; display: grid; grid-template-rows: 58px minmax(0, 1fr) 72px;
        color: #18231f; background: #edf4f1; font-family: system-ui, sans-serif;
      }
      html.platform-android.app-starting[data-theme="dark"] .android-startup-shell { color: #eef6ff; background: #08111f; }
      .android-startup-shell header { display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid rgba(100,120,112,.16); font-weight: 700; }
      .android-startup-shell header small { min-width: 0; overflow: hidden; opacity: .56; font-size: 12px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
      .android-startup-shell main { display: grid; place-items: center; }
      .android-startup-shell main i { width: 34px; height: 34px; border-radius: 10px; background: rgba(37,142,96,.16); box-shadow: inset 0 0 0 1px rgba(37,142,96,.2); }
      .android-startup-shell nav { margin: 8px 10px 10px; border-radius: 18px; background: rgba(255,255,255,.62); box-shadow: 0 8px 24px rgba(22,45,35,.08); }
      html.platform-android.app-starting[data-theme="dark"] .android-startup-shell nav { background: rgba(22,35,52,.86); }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>CodeCourse</title>
  </head>
  <body>
    <script>
      (function() {
        var stored = localStorage.getItem("codecourse.theme");
        var theme = (stored === "light" || stored === "dark")
          ? stored
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var bg = theme === "dark" ? "#08111f" : "#edf4f1";
        var androidWebView = /\bAndroid\b/i.test(navigator.userAgent)
          && (/\bwv\b/i.test(navigator.userAgent) || location.hostname === "localhost");
        if (androidWebView) document.documentElement.classList.add("platform-android");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.setAttribute("content", theme === "dark" ? "#08111f" : "#edf4f1");
      })();
    </script>
    <div id="root"><div class="android-startup-shell" aria-label="CodeCourse 正在启动"><header>CodeCourse <small id="android-startup-project"></small></header><main><i aria-hidden="true"></i></main><nav></nav></div></div>
    <script>document.getElementById("android-startup-project").textContent = localStorage.getItem("codecourse-last-project-name") || "";</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
