name: Production Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.16.1"
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r backend/requirements-build.txt
      - name: Verify production source excludes redesign experiments
        shell: pwsh
        run: |
          $forbidden = git ls-files frontend experiments resources electron | Select-String -Pattern '(^experiments/|direction-c|DirectionShell|Milkfrog|milkfrog|live2d)'
          if ($forbidden) { throw "Redesign files must not enter the production release: $forbidden" }
      - name: Test frontend
        run: pnpm --dir frontend run test
      - name: Build installer and portable executable
        run: pnpm run desktop:release
      - name: Verify Windows version metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $productVersion = (Get-Item dist-desktop/win-unpacked/CodeCourse.exe).VersionInfo.ProductVersion
          if ($productVersion -ne $version) {
            throw "Windows ProductVersion $productVersion does not match package version $version"
          }
      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist-desktop/CodeCourse-*-setup.exe
            dist-desktop/CodeCourse-*-portable.exe
            dist-desktop/*.blockmap
            dist-desktop/latest.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-windows
          path: release-assets
          merge-multiple: true
      - name: Verify release version and create checksums
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test -f "release-assets/CodeCourse-${VERSION}-setup.exe"
          test -f "release-assets/CodeCourse-${VERSION}-portable.exe"
          cd release-assets
          sha256sum CodeCourse-${VERSION}-setup.exe CodeCourse-${VERSION}-portable.exe > SHA256SUMS.txt
          cp ../RELEASE_NOTES.md "CodeCourse-${VERSION}-guide.md"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/CodeCourse-*-setup.exe
            release-assets/CodeCourse-*-portable.exe
            release-assets/SHA256SUMS.txt
            release-assets/CodeCourse-*-guide.md
            release-assets/latest.yml
            release-assets/*.blockmap
